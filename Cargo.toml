[package]
name = "rusty_extract"
version = "0.1.0"
edition = "2021"
description = "Rust port of UniExtract2's file-type detection and extraction-orchestration engine"
publish = false
repository = "https://github.com/baileyrd/rusty_extract"

[[bin]]
name = "rusty_extract"
path = "src/main.rs"

[lib]
name = "rusty_extract"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.20"
rfd = "0.15"
